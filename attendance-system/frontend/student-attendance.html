<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Attendance · AttendCloud</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-mount"></div>
    <main class="main-content" id="main-mount">

      <div class="card card-ledger mb-3">
        <div class="card-body d-flex flex-wrap gap-3 align-items-end">
          <div style="min-width:220px;">
            <label class="form-label mb-1">From</label>
            <input type="date" class="form-control form-control-sm" id="fromDate">
          </div>
          <div style="min-width:220px;">
            <label class="form-label mb-1">To</label>
            <input type="date" class="form-control form-control-sm" id="toDate">
          </div>
          <button class="btn btn-outline-ink btn-sm" id="filterBtn">Apply Filter</button>
          <button class="btn btn-ink btn-sm" id="clearFilterBtn">Clear</button>
        </div>
      </div>

      <div class="card card-ledger">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span>Attendance History</span>
          <span class="text-muted-soft" id="historyMeta" style="font-size:0.8rem;"></span>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-ledger mb-0">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Subject</th>
                  <th>Class</th>
                  <th>Status</th>
                  <th>Remarks</th>
                </tr>
              </thead>
              <tbody id="historyTableBody">
                <tr><td colspan="5" class="text-center text-muted-soft py-4">Loading…</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script>
    const user = Auth.guard(['student']);
    UI.renderShell('My Attendance');

    const renderHistory = (history) => {
      const tbody = document.getElementById('historyTableBody');
      document.getElementById('historyMeta').textContent = `${history.length} record${history.length !== 1 ? 's' : ''}`;

      if (!history.length) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted-soft py-4">No attendance records found for this period.</td></tr>`;
        return;
      }

      tbody.innerHTML = [...history].reverse().map(h => `
        <tr>
          <td>${UI.formatDate(h.date)}</td>
          <td>${h.subject ? `${h.subject.name} (${h.subject.code})` : '—'}</td>
          <td>${h.classSession ? h.classSession.name : '—'}</td>
          <td>${UI.statusBadge(h.status)}</td>
          <td>${h.remarks || '—'}</td>
        </tr>
      `).join('');
    };

    const loadHistory = async () => {
      const from = document.getElementById('fromDate').value;
      const to = document.getElementById('toDate').value;
      const params = new URLSearchParams();
      if (from) params.set('from', from);
      if (to) params.set('to', to);

      try {
        const data = await API.get(`/attendance/student/${user._id}?${params.toString()}`);
        renderHistory(data.history);
      } catch (err) {
        UI.toast(err.message, 'danger');
      }
    };

    document.getElementById('filterBtn').addEventListener('click', loadHistory);
    document.getElementById('clearFilterBtn').addEventListener('click', () => {
      document.getElementById('fromDate').value = '';
      document.getElementById('toDate').value = '';
      loadHistory();
    });

    loadHistory();
  </script>
</body>
</html>
