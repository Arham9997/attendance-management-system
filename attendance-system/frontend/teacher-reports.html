<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports · AttendCloud</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-mount"></div>
    <main class="main-content" id="main-mount">

      <div class="card card-ledger mb-3">
        <div class="card-body d-flex flex-wrap gap-3 align-items-end">
          <div style="min-width:260px;">
            <label class="form-label mb-1">Class</label>
            <select class="form-select form-select-sm" id="classSelect"></select>
          </div>
          <button class="btn btn-amber btn-sm" id="downloadClassExcelBtn">Download Class Report (Excel)</button>
        </div>
      </div>

      <div class="card card-ledger">
        <div class="card-header">Student Attendance — Selected Class</div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-ledger mb-0">
              <thead>
                <tr>
                  <th>Roll No.</th>
                  <th>Student</th>
                  <th>Total Classes</th>
                  <th>Present</th>
                  <th>Absent</th>
                  <th>Attendance %</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="reportTableBody">
                <tr><td colspan="7" class="text-center text-muted-soft py-4">Select a class to view the report.</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script>
    const user = Auth.guard(['teacher', 'admin']);
    UI.renderShell('Reports');

    let classCache = [];

    const loadClasses = async () => {
      const { classes } = await API.get('/classes');
      classCache = classes;
      const select = document.getElementById('classSelect');
      if (!classes.length) {
        select.innerHTML = '<option value="">No classes available</option>';
        return;
      }
      select.innerHTML = classes.map(c => `<option value="${c._id}">${c.name} — ${c.subject ? c.subject.code : ''}</option>`).join('');
      loadReport();
    };

    const loadReport = async () => {
      const classId = document.getElementById('classSelect').value;
      if (!classId) return;
      const cls = classCache.find(c => c._id === classId);

      const tbody = document.getElementById('reportTableBody');
      tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted-soft py-4">Loading…</td></tr>`;

      if (!cls.students.length) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted-soft py-4">No students enrolled in this class.</td></tr>`;
        return;
      }

      try {
        const rows = await Promise.all(cls.students.map(async (s) => {
          const stats = await API.get(`/attendance/student/${s._id}?classSessionId=${classId}`);
          return { student: s, stats };
        }));

        tbody.innerHTML = rows.map(({ student, stats }) => `
          <tr>
            <td>${student.rollNumber || '—'}</td>
            <td>${student.name}</td>
            <td>${stats.totalClasses}</td>
            <td>${stats.present}</td>
            <td>${stats.absent}</td>
            <td>
              <div class="d-flex align-items-center gap-2">
                <div class="pct-bar-track" style="width:70px;">
                  <div class="pct-bar-fill ${UI.pctClass(stats.percentage)}" style="width:${stats.percentage}%;"></div>
                </div>
                <strong class="${UI.pctTextClass(stats.percentage)}">${stats.percentage}%</strong>
              </div>
            </td>
            <td class="text-end">
              <button class="btn btn-sm btn-outline-ink" onclick="downloadPDF('${student._id}')">PDF</button>
              <button class="btn btn-sm btn-outline-ink" onclick="downloadExcel('${student._id}')">Excel</button>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        UI.toast(err.message, 'danger');
      }
    };

    const triggerDownload = (blob, filename) => {
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      window.URL.revokeObjectURL(url);
    };

    window.downloadPDF = async (studentId) => {
      try {
        const blob = await API.downloadBlob(`/reports/student/${studentId}/pdf`);
        triggerDownload(blob, `attendance_${studentId}.pdf`);
      } catch (err) {
        UI.toast(err.message, 'danger');
      }
    };

    window.downloadExcel = async (studentId) => {
      try {
        const blob = await API.downloadBlob(`/reports/student/${studentId}/excel`);
        triggerDownload(blob, `attendance_${studentId}.xlsx`);
      } catch (err) {
        UI.toast(err.message, 'danger');
      }
    };

    document.getElementById('downloadClassExcelBtn').addEventListener('click', async () => {
      const classId = document.getElementById('classSelect').value;
      if (!classId) return;
      try {
        const blob = await API.downloadBlob(`/reports/class/${classId}/excel`);
        triggerDownload(blob, `class_${classId}_attendance.xlsx`);
      } catch (err) {
        UI.toast(err.message, 'danger');
      }
    });

    document.getElementById('classSelect').addEventListener('change', loadReport);

    loadClasses();
  </script>
</body>
</html>
