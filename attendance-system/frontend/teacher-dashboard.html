<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Dashboard · AttendCloud</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-mount"></div>
    <main class="main-content" id="main-mount">

      <div class="row g-3 mb-4">
        <div class="col-6 col-lg-3">
          <div class="stat-card">
            <div class="stat-label">My Classes</div>
            <div class="stat-value" id="totalClassesStat">—</div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="stat-card">
            <div class="stat-label">Marked Today</div>
            <div class="stat-value" id="markedTodayStat">—</div>
          </div>
        </div>
      </div>

      <div class="card card-ledger">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span>Your Classes</span>
          <a href="teacher-classes.html" class="btn btn-amber btn-sm">+ New Class</a>
        </div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-ledger mb-0">
              <thead>
                <tr>
                  <th>Class</th>
                  <th>Subject</th>
                  <th>Students</th>
                  <th>Today's Status</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="classTableBody">
                <tr><td colspan="5" class="text-center text-muted-soft py-4">Loading…</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script>
    const user = Auth.guard(['teacher']);
    UI.renderShell('Teacher Dashboard');

    (async () => {
      try {
        const { totalClasses, classes } = await API.get('/dashboard/teacher');
        document.getElementById('totalClassesStat').textContent = totalClasses;
        document.getElementById('markedTodayStat').textContent =
          `${classes.filter(c => c.markedToday).length}/${totalClasses}`;

        const tbody = document.getElementById('classTableBody');
        if (!classes.length) {
          tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4"><div class="empty-state"><div class="icon">&#9670;</div>You haven't created any classes yet.<br/><a href="teacher-classes.html" class="btn btn-ink btn-sm mt-2">Create your first class</a></div></td></tr>`;
          return;
        }

        tbody.innerHTML = classes.map(c => `
          <tr>
            <td><strong>${c.name}</strong></td>
            <td>${c.subject ? `${c.subject.name} (${c.subject.code})` : '—'}</td>
            <td>${c.studentCount}</td>
            <td>${c.markedToday
              ? '<span class="badge-soft badge-present">marked</span>'
              : '<span class="badge-soft badge-late">pending</span>'}</td>
            <td class="text-end">
              <a href="teacher-attendance.html?classId=${c._id}" class="btn btn-sm btn-outline-ink">Mark Attendance</a>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        UI.toast(err.message, 'danger');
      }
    })();
  </script>
</body>
</html>
