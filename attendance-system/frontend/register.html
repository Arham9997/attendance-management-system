<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account · AttendCloud</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-side">
        <div>
          <div class="mark-lg">A</div>
          <h2 class="display-font text-white mb-2">Join AttendCloud</h2>
          <p style="color:#c7c3b3;">Student accounts can self-register. Your teacher or admin will enroll you into classes and subjects.</p>
        </div>
        <div></div>
      </div>

      <div class="auth-form-side">
        <h3 class="display-font mb-1">Create your account</h3>
        <p class="text-muted-soft mb-4">Self-registration is available for students.</p>

        <form id="registerForm">
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" id="name" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Roll Number</label>
            <input type="text" class="form-control" id="rollNumber" placeholder="e.g. CSE2024010" />
          </div>
          <div class="mb-3">
            <label class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="password" required minlength="6" />
          </div>
          <div id="registerError" class="text-danger small mb-2" style="display:none;"></div>
          <button type="submit" class="btn btn-ink w-100 mt-2" id="registerBtn">Create Account</button>
        </form>

        <p class="text-center text-muted-soft mt-4 mb-0" style="font-size:0.88rem;">
          Already have an account? <a href="login.html" style="color:var(--amber-dark); font-weight:600;">Sign in</a>
        </p>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    if (Auth.isLoggedIn()) Auth.redirectToDashboard();

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('registerBtn');
      const errEl = document.getElementById('registerError');
      errEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Creating account…';

      try {
        const payload = {
          name: document.getElementById('name').value.trim(),
          rollNumber: document.getElementById('rollNumber').value.trim(),
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
          role: 'student',
        };
        const data = await API.post('/auth/register', payload);
        Auth.setSession(data.token, data.user);
        Auth.redirectToDashboard();
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
