<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Departments · AttendCloud</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-mount"></div>
    <main class="main-content" id="main-mount">

      <div class="d-flex justify-content-end mb-3">
        <button class="btn btn-amber btn-sm" data-bs-toggle="modal" data-bs-target="#deptModal" id="addDeptBtn">+ Add Department</button>
      </div>

      <div class="row g-3" id="deptGrid">
        <div class="col-12 text-center text-muted-soft py-4">Loading departments…</div>
      </div>

    </main>
  </div>

  <div class="modal fade" id="deptModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="deptForm">
          <div class="modal-header">
            <h5 class="modal-title display-font" id="deptModalTitle">Add Department</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="deptId">
            <div class="mb-3">
              <label class="form-label">Department Name</label>
              <input type="text" class="form-control" id="deptName" required placeholder="Computer Science & Engineering">
            </div>
            <div class="mb-3">
              <label class="form-label">Department Code</label>
              <input type="text" class="form-control" id="deptCode" required placeholder="CSE">
            </div>
            <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea class="form-control" id="deptDescription" rows="3"></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-ink" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-ink" id="deptSaveBtn">Save Department</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script>
    const user = Auth.guard(['admin']);
    UI.renderShell('Departments');

    let deptCache = [];
    let editingDeptId = null;
    const deptModal = new bootstrap.Modal(document.getElementById('deptModal'));

    const renderDepts = (depts) => {
      const grid = document.getElementById('deptGrid');
      if (!depts.length) {
        grid.innerHTML = `<div class="col-12"><div class="empty-state"><div class="icon">&#9633;</div>No departments yet. Add your first one.</div></div>`;
        return;
      }
      grid.innerHTML = depts.map(d => `
        <div class="col-md-6 col-lg-4">
          <div class="card card-ledger h-100">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-start">
                <div>
                  <span class="badge-soft badge-excused mb-2">${d.code}</span>
                  <h5 class="display-font mb-1">${d.name}</h5>
                </div>
              </div>
              <p class="text-muted-soft mb-3" style="font-size:0.88rem; min-height:40px;">${d.description || 'No description provided.'}</p>
              <div class="d-flex gap-2">
                <button class="btn btn-sm btn-outline-ink" onclick="editDept('${d._id}')">Edit</button>
                <button class="btn btn-sm btn-outline-danger" onclick="deleteDept('${d._id}')">Delete</button>
              </div>
            </div>
          </div>
        </div>
      `).join('');
    };

    const fetchDepts = async () => {
      try {
        const { departments } = await API.get('/departments');
        deptCache = departments;
        renderDepts(departments);
      } catch (err) {
        UI.toast(err.message, 'danger');
      }
    };

    document.getElementById('addDeptBtn').addEventListener('click', () => {
      editingDeptId = null;
      document.getElementById('deptForm').reset();
      document.getElementById('deptModalTitle').textContent = 'Add Department';
    });

    window.editDept = (id) => {
      const d = deptCache.find(x => x._id === id);
      if (!d) return;
      editingDeptId = id;
      document.getElementById('deptModalTitle').textContent = 'Edit Department';
      document.getElementById('deptName').value = d.name;
      document.getElementById('deptCode').value = d.code;
      document.getElementById('deptDescription').value = d.description || '';
      deptModal.show();
    };

    window.deleteDept = async (id) => {
      if (!confirm('Delete this department? Subjects/users referencing it may be affected.')) return;
      try {
        await API.del(`/departments/${id}`);
        UI.toast('Department deleted', 'success');
        fetchDepts();
      } catch (err) {
        UI.toast(err.message, 'danger');
      }
    };

    document.getElementById('deptForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('deptSaveBtn');
      btn.disabled = true;
      const payload = {
        name: document.getElementById('deptName').value.trim(),
        code: document.getElementById('deptCode').value.trim(),
        description: document.getElementById('deptDescription').value.trim(),
      };
      try {
        if (editingDeptId) {
          await API.put(`/departments/${editingDeptId}`, payload);
          UI.toast('Department updated', 'success');
        } else {
          await API.post('/departments', payload);
          UI.toast('Department created', 'success');
        }
        deptModal.hide();
        fetchDepts();
      } catch (err) {
        UI.toast(err.message, 'danger');
      } finally {
        btn.disabled = false;
      }
    });

    fetchDepts();
  </script>
</body>
</html>
