<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subjects · AttendCloud</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-mount"></div>
    <main class="main-content" id="main-mount">

      <div class="d-flex justify-content-end mb-3">
        <button class="btn btn-amber btn-sm" data-bs-toggle="modal" data-bs-target="#subjModal" id="addSubjBtn">+ Add Subject</button>
      </div>

      <div class="card card-ledger">
        <div class="card-header">All Subjects</div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-ledger mb-0">
              <thead>
                <tr>
                  <th>Code</th>
                  <th>Name</th>
                  <th>Department</th>
                  <th>Semester</th>
                  <th>Teacher</th>
                  <th>Credits</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="subjTableBody">
                <tr><td colspan="7" class="text-center text-muted-soft py-4">Loading subjects…</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </main>
  </div>

  <div class="modal fade" id="subjModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="subjForm">
          <div class="modal-header">
            <h5 class="modal-title display-font" id="subjModalTitle">Add Subject</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="subjId">
            <div class="mb-3">
              <label class="form-label">Subject Name</label>
              <input type="text" class="form-control" id="subjName" required placeholder="Data Structures & Algorithms">
            </div>
            <div class="row">
              <div class="col-6 mb-3">
                <label class="form-label">Subject Code</label>
                <input type="text" class="form-control" id="subjCode" required placeholder="CSE301">
              </div>
              <div class="col-6 mb-3">
                <label class="form-label">Credits</label>
                <input type="number" class="form-control" id="subjCredits" value="3" min="1" max="10">
              </div>
            </div>
            <div class="row">
              <div class="col-6 mb-3">
                <label class="form-label">Department</label>
                <select class="form-select" id="subjDepartment" required></select>
              </div>
              <div class="col-6 mb-3">
                <label class="form-label">Semester</label>
                <input type="number" class="form-control" id="subjSemester" min="1" max="12" value="1">
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Assigned Teacher</label>
              <select class="form-select" id="subjTeacher">
                <option value="">— Unassigned —</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-ink" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-ink" id="subjSaveBtn">Save Subject</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script>
    const user = Auth.guard(['admin']);
    UI.renderShell('Subjects');

    let subjCache = [];
    let editingSubjId = null;
    const subjModal = new bootstrap.Modal(document.getElementById('subjModal'));

    const loadDropdowns = async () => {
      const [{ departments }, { users: teachers }] = await Promise.all([
        API.get('/departments'),
        API.get('/users?role=teacher'),
      ]);
      document.getElementById('subjDepartment').innerHTML = departments.map(d => `<option value="${d._id}">${d.name}</option>`).join('');
      document.getElementById('subjTeacher').innerHTML = '<option value="">— Unassigned —</option>' +
        teachers.map(t => `<option value="${t._id}">${t.name}</option>`).join('');
    };

    const renderSubjects = (subjects) => {
      const tbody = document.getElementById('subjTableBody');
      if (!subjects.length) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted-soft py-4">No subjects yet.</td></tr>`;
        return;
      }
      tbody.innerHTML = subjects.map(s => `
        <tr>
          <td><span class="badge-soft badge-excused">${s.code}</span></td>
          <td><strong>${s.name}</strong></td>
          <td>${s.department ? s.department.name : '—'}</td>
          <td>${s.semester || '—'}</td>
          <td>${s.teacher ? s.teacher.name : '<span class="text-muted-soft">Unassigned</span>'}</td>
          <td>${s.credits}</td>
          <td class="text-end">
            <button class="btn btn-sm btn-outline-ink me-1" onclick="editSubject('${s._id}')">Edit</button>
            <button class="btn btn-sm btn-outline-danger" onclick="deleteSubject('${s._id}')">Delete</button>
          </td>
        </tr>
      `).join('');
    };

    const fetchSubjects = async () => {
      try {
        const { subjects } = await API.get('/subjects');
        subjCache = subjects;
        renderSubjects(subjects);
      } catch (err) {
        UI.toast(err.message, 'danger');
      }
    };

    document.getElementById('addSubjBtn').addEventListener('click', () => {
      editingSubjId = null;
      document.getElementById('subjForm').reset();
      document.getElementById('subjModalTitle').textContent = 'Add Subject';
    });

    window.editSubject = (id) => {
      const s = subjCache.find(x => x._id === id);
      if (!s) return;
      editingSubjId = id;
      document.getElementById('subjModalTitle').textContent = 'Edit Subject';
      document.getElementById('subjName').value = s.name;
      document.getElementById('subjCode').value = s.code;
      document.getElementById('subjCredits').value = s.credits;
      document.getElementById('subjDepartment').value = s.department ? s.department._id : '';
      document.getElementById('subjSemester').value = s.semester || 1;
      document.getElementById('subjTeacher').value = s.teacher ? s.teacher._id : '';
      subjModal.show();
    };

    window.deleteSubject = async (id) => {
      if (!confirm('Delete this subject?')) return;
      try {
        await API.del(`/subjects/${id}`);
        UI.toast('Subject deleted', 'success');
        fetchSubjects();
      } catch (err) {
        UI.toast(err.message, 'danger');
      }
    };

    document.getElementById('subjForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('subjSaveBtn');
      btn.disabled = true;
      const payload = {
        name: document.getElementById('subjName').value.trim(),
        code: document.getElementById('subjCode').value.trim(),
        credits: Number(document.getElementById('subjCredits').value),
        department: document.getElementById('subjDepartment').value,
        semester: Number(document.getElementById('subjSemester').value),
        teacher: document.getElementById('subjTeacher').value || undefined,
      };
      try {
        if (editingSubjId) {
          await API.put(`/subjects/${editingSubjId}`, payload);
          UI.toast('Subject updated', 'success');
        } else {
          await API.post('/subjects', payload);
          UI.toast('Subject created', 'success');
        }
        subjModal.hide();
        fetchSubjects();
      } catch (err) {
        UI.toast(err.message, 'danger');
      } finally {
        btn.disabled = false;
      }
    });

    (async () => {
      await loadDropdowns();
      await fetchSubjects();
    })();
  </script>
</body>
</html>
