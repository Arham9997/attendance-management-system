<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Dashboard · AttendCloud</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-mount"></div>
    <main class="main-content" id="main-mount">

      <div class="row g-3 mb-4">
        <div class="col-md-4">
          <div class="stat-card text-center">
            <div class="stat-label">Overall Attendance</div>
            <div class="stat-value" id="overallPct" style="font-size:2.6rem;">—</div>
            <div class="pct-bar-track mt-2">
              <div class="pct-bar-fill" id="overallBarFill" style="width:0%;"></div>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="stat-card">
            <div class="stat-label">Total Classes</div>
            <div class="stat-value" id="totalClassesStat">—</div>
            <div class="stat-meta" id="presentAbsentMeta"></div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="stat-card">
            <div class="stat-label">Status</div>
            <div id="statusMessage" style="font-size:0.95rem; margin-top:0.4rem;"></div>
          </div>
        </div>
      </div>

      <div class="card card-ledger">
        <div class="card-header">Attendance by Subject</div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-ledger mb-0">
              <thead>
                <tr>
                  <th>Subject</th>
                  <th>Total Classes</th>
                  <th>Present</th>
                  <th>Absent</th>
                  <th>Attendance %</th>
                </tr>
              </thead>
              <tbody id="subjectTableBody">
                <tr><td colspan="5" class="text-center text-muted-soft py-4">Loading…</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script>
    const user = Auth.guard(['student']);
    UI.renderShell('My Dashboard');

    (async () => {
      try {
        const overall = await API.get(`/attendance/student/${user._id}`);
        document.getElementById('overallPct').textContent = `${overall.percentage}%`;
        document.getElementById('overallPct').className = `stat-value ${UI.pctTextClass(overall.percentage)}`;
        document.getElementById('overallBarFill').style.width = `${overall.percentage}%`;
        document.getElementById('overallBarFill').className = `pct-bar-fill ${UI.pctClass(overall.percentage)}`;
        document.getElementById('totalClassesStat').textContent = overall.totalClasses;
        document.getElementById('presentAbsentMeta').textContent = `${overall.present} present · ${overall.absent} absent · ${overall.late} late`;

        const statusEl = document.getElementById('statusMessage');
        if (overall.percentage >= 85) {
          statusEl.innerHTML = `<span class="badge-soft badge-present">On Track</span><p class="text-muted-soft mt-2 mb-0" style="font-size:0.85rem;">Great consistency — keep it up.</p>`;
        } else if (overall.percentage >= 75) {
          statusEl.innerHTML = `<span class="badge-soft badge-late">Watch Closely</span><p class="text-muted-soft mt-2 mb-0" style="font-size:0.85rem;">You're near the minimum requirement.</p>`;
        } else {
          statusEl.innerHTML = `<span class="badge-soft badge-absent">Below Requirement</span><p class="text-muted-soft mt-2 mb-0" style="font-size:0.85rem;">Your attendance is below the required threshold. Please speak with your teacher.</p>`;
        }

        const { breakdown } = await API.get(`/attendance/student/${user._id}/by-subject`);
        const tbody = document.getElementById('subjectTableBody');
        if (!breakdown.length) {
          tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted-soft py-4">You're not enrolled in any subjects yet.</td></tr>`;
        } else {
          tbody.innerHTML = breakdown.map(b => `
            <tr>
              <td><strong>${b.subject.name}</strong> <span class="text-muted-soft">(${b.subject.code})</span></td>
              <td>${b.totalClasses}</td>
              <td>${b.present}</td>
              <td>${b.absent}</td>
              <td>
                <div class="d-flex align-items-center gap-2">
                  <div class="pct-bar-track" style="width:90px;">
                    <div class="pct-bar-fill ${UI.pctClass(b.percentage)}" style="width:${b.percentage}%;"></div>
                  </div>
                  <strong class="${UI.pctTextClass(b.percentage)}">${b.percentage}%</strong>
                </div>
              </td>
            </tr>
          `).join('');
        }
      } catch (err) {
        UI.toast(err.message, 'danger');
      }
    })();
  </script>
</body>
</html>
